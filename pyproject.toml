[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forexbot"
version = "0.1.0"
description = "Broker-agnostic Forex trading robot with backtester (MT5 + NinjaTrader)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0"]
dev = ["pytest>=7.0"]

[project.scripts]
forexbot = "forexbot.cli:main"

[tool.setuptools.packages.find]
include = ["forexbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
